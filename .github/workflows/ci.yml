name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[decode,dev]"
      - name: Tests
        run: python -m pytest -q
        env:
          CANOPENER_MIN_FPS: "3000"     # shared runners are slower than a desktop PC

  release:
    # A v* tag builds the Windows app and attaches the zip to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[app,gs_usb,decode,dev]"
      - name: Tag matches the version
        shell: pwsh
        run: |
          $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $v" }
      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -OutDir dist -Python python
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/canopener-*-win64.zip
